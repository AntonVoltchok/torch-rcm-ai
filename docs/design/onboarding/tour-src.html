/* ---------- code panes ---------- */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function hl(src) {
  return src.split('\n').map((ln) => {
    const t = ln.trimStart();
    if (t.startsWith('#') || t.startsWith('//')) return `<span class="c">${esc(ln)}</span>`;
    let h = esc(ln);
    h = h.replace(/(&lt;\/?(?:world_content|tool_data)[^&]*?&gt;)/g, '<span class="u">$1</span>');
    h = h.replace(/"([^"\n]*)"(\s*:)/g, '<span class="k">"$1"</span>$2');
    h = h.replace(/(:\s*|\[\s*|,\s*)"([^"\n]*)"/g, '$1<span class="s">"$2"</span>');
    h = h.replace(/(:\s*)(-?\d[\d.]*|true|false|null)\b/g, '$1<span class="n">$2</span>');
    h = h.replace(/(\s)(# [^\n]*)$/, '$1<span class="c">$2</span>');
    return h;
  }).join('\n');
}

function find(spec) {
  if (!spec) return null;
  const root = approot;
  const one = (s) => {
    if (s.startsWith('@')) {
      const text = s.slice(1);
      let best = null;
      for (const el of root.querySelectorAll('*')) {
        if (el.children.length > 40) continue;
        if (el.textContent && el.textContent.includes(text)) { if (!best || best.contains(el)) best = el; }
      }
      return best;
    }
    return root.querySelector(s);
  };
  if (Array.isArray(spec)) { const el = one(spec[0]); return el && spec[1] ? el.closest(spec[1]) || el : el; }
  return one(spec);
}

function revealRun(stepsSel, ms, done) {
  const items = $$(stepsSel, approot);

}
function playSeq(seq, done) {

  seq.forEach(([snap, ms, fx]) => {
    later(() => { show(snap); if (fx) fx(); place(); }, t);

}

function render() {

/* scroll the anchor into view inside the snapshot's own scroll containers (the page never scrolls) */
function reveal(el, mode) {
  if (!el) return;
  el.scrollIntoView({ block: mode || 'nearest', inline: 'nearest' });
  window.scrollTo(0, 0); $('.tour-page').scrollTop = 0; $('#stageWrap').scrollTop = 0;

function place(first) {
  if (!tour) return; const s = tour.steps[idx]; if (!s || s.modal) return;
  const el = find(s._target || s.target);
  const hole = $('#hole'), card = $('#card');
  if (!el) { console.warn('tour anchor not found', tourId, idx, s._target || s.target); }
  if (el && first) reveal(el, s.scroll);
  const sr = $('#stage').getBoundingClientRect();
  const r0 = el ? el.getBoundingClientRect() : sr;
  // clip the anchor to the visible stage
  const r = { left: Math.max(r0.left, sr.left), top: Math.max(r0.top, sr.top), right: Math.min(r0.right, sr.right), bottom: Math.min(r0.bottom, sr.bottom) };
  r.width = Math.max(0, r.right - r.left); r.height = Math.max(0, r.bottom - r.top);
  const pad = 5;
  hole.style.top = r.top - pad + 'px'; hole.style.left = r.left - pad + 'px';
  hole.style.width = r.width + pad * 2 + 'px'; hole.style.height = r.height + pad * 2 + 'px';

  const vw = innerWidth, vh = innerHeight, gap = 14, M = 12;
  const codeOn = !card.classList.contains('nocode');
  const wide = Math.min(1180, vw - 2 * M), narrowW = Math.min(500, vw - 2 * M);
  const wantH = codeOn ? Math.min(560, Math.max(380, vh * 0.56)) : 0;
  card.classList.remove('narrow');
  card.style.height = ''; card.style.maxHeight = '';
  const below = vh - (r.bottom + pad) - gap - M, above = r.top - pad - gap - M;
  const right = vw - (r.right + pad) - gap - M, left = r.left - pad - gap - M;
  let W = codeOn ? wide : narrowW, H, top, x;
  const natural = () => { card.style.width = W + 'px'; card.style.height = 'auto'; card.style.maxHeight = vh - 2 * M + 'px'; return card.offsetHeight; };
  if (!codeOn) {
    H = natural();
    if (below >= H) top = r.bottom + pad + gap; else if (above >= H) top = r.top - pad - gap - H;
    else if (right >= W) { x = r.right + pad + gap; top = r.top; } else if (left >= W) { x = r.left - pad - gap - W; top = r.top; }
    else top = (r.top + r.height / 2 > vh / 2) ? M : vh - M - H;
  } else {
    const minH = 330;
    if (below >= minH) { H = Math.min(wantH, below); top = r.bottom + pad + gap; }
    else if (above >= minH) { H = Math.min(wantH, above); top = r.top - pad - gap - H; }
    else if (right >= narrowW || left >= narrowW) {
      W = narrowW; card.classList.add('narrow'); H = Math.min(vh - 2 * M, 640);
      x = right >= narrowW ? r.right + pad + gap : r.left - pad - gap - W; top = Math.max(M, Math.min(r.top, vh - M - H));
    } else {
      // No side has room: cover the half of the screen the anchor is not in, and keep the hole's middle visible.
      const mid = r.top + r.height / 2;
      H = Math.min(wantH, Math.max(minH, mid > vh / 2 ? mid - 60 - M : vh - mid - 60 - M));
      top = mid > vh / 2 ? M : vh - M - H;
    }
    card.style.width = W + 'px'; card.style.height = H + 'px';
  }
  if (x === undefined) x = W >= vw - 2 * M - 40 ? (vw - W) / 2 : r.left + r.width / 2 - W / 2;
  x = Math.max(M, Math.min(x, vw - W - M)); top = Math.max(M, Math.min(top, vh - M - (H || card.offsetHeight)));
  card.style.left = x + 'px'; card.style.top = top + 'px';
}

  { snap: 'inbox_morgan_before_adv', screen: 'inbox', target: '[data-testid=clock-control]', ey: 'the scheduler · owner only', title: 'The loop closes overnight',
    html: `<p>Only the owner moves the clock, so the tour switched <b>Signed in as</b> to Dr. Morgan for this step (Dana’s sidebar says “Clock control: Dr. Morgan”). <b>Skip to Thu 7:10 AM</b> returns 202 at once; the scheduler then fires every due event in sim time: the 11:15 file leaves, Vyne’s 277CA acknowledges it, overnight 835s arrive and <b>each denial goes to the agent its codes name</b>, and the morning status checks fire.</p>

    tryit: { label: 'Try it · Skip to Thu 7:10 AM', busy: 'Advancing…', doneLabel: 'Thursday 7:10 · signed in as Dana again', target: ['@Yours', 'section'],

  { modal: true, snap: 'inbox', screen: 'inbox', title: 'That is the loop', ey: 'Screen tours',
    html: `<p>Seed data in; codes routed to an agent; facts computed by code; a plan; a verdict from policy; a person’s decision; a fixed recipe to the payer; remittances back overnight. Each screen has its own tour. It opens the first time you land on the screen, and <b>Tour this screen</b> in the sidebar restarts it.</p>

const SCREEN_TOURS = ['inbox', 'denials', 'ledger', 'claims', 'claim', 'payments', 'patients', 'eligibility', 'activity', 'cash', 'settings'];

/* ---------- wiring ---------- */
$('#screenSel').innerHTML = SCREENS.map((s) => `<option value="${s.id}">${s.label}</option>`).join('');
$('#screenSel').onchange = (e) => { if (tour) exit(); goScreen(e.target.value); };
$('#screenTour').onclick = () => { if (tour) exit(); start(currentScreen); };
$('#mainTour').onclick = () => { if (tour) exit(); start('main'); };
approot.addEventListener('click', (e) => {
  if (e.target.closest('#tourThis')) { e.preventDefault(); if (tour) exit(); start(currentScreen); return; }
  const a = e.target.closest('a[href]');
  e.preventDefault();
  if (tour) return;
  if (a) {
    const to = routeToScreen(a.getAttribute('href'));
    if (to) { currentScreen = to.id; $('#screenSel').value = to.id; show(to.snap); const seen = store.get('seen', {}); if (!seen[to.id]) start(to.id); }
    else toast('This mock holds snapshots of the tour’s screens only; that link works in the app.');
  } else if (e.target.closest('button,input,select,[role=button],[role=radio]')) {
    toast('A snapshot: the tour’s “Try it” buttons drive the states that were captured.');
  }
}, true);
approot.addEventListener('change', (e) => e.preventDefault(), true);
addEventListener('keydown', (e) => {
  if (!tour) return;
  if (e.target.closest && e.target.closest('select,input,textarea')) return;
  const s = tour.steps[idx];
  if (e.key === 'Escape') exit();
  else if (e.key === 'ArrowRight' || (e.key === 'Enter' && !e.target.closest('button'))) { if (idx === tour.steps.length - 1) (s.onPrimary || s.finish || exit)(); else go(idx + 1); }
  else if (e.key === 'ArrowLeft') go(idx - 1);
});
addEventListener('resize', () => { fit(); place(); });
fit();
goScreen('inbox', { silent: true });
/* opens on every launch, as the owner asked */
start('main');
window.__tour = { TOURS, SCREENS, start, go, find, show, place, get state() { return { tourId, idx, snap: currentSnap }; } };
})();
