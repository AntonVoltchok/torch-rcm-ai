<title>Torch Redesign Variations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a slim comparison bar over one scaled 1440×900 stage, with feedback in a side drawer. */
:root{
  --bg:#f1f2f4;--panel:#ffffff;--fg:#1b1e24;--muted:#5a6170;--line:#d8dbe1;--accent:#1f5d4c;--accent-fg:#ffffff;--soft:#e6efec;--bad:#a4332a;--badbg:#f8e7e4;
  --font:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--panel:#1e2228;--fg:#eceef2;--muted:#a3abb8;--line:#343a44;--accent:#69c3a8;--accent-fg:#0f1a17;--soft:#233430;--bad:#f0a59c;--badbg:#3a2321;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--panel:#1e2228;--fg:#eceef2;--muted:#a3abb8;--line:#343a44;--accent:#69c3a8;--accent-fg:#0f1a17;--soft:#233430;--bad:#f0a59c;--badbg:#3a2321;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.name{font-weight:700;font-size:15px;margin-right:4px}
.seg{display:inline-flex;gap:2px;background:var(--bg);border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-weight:600;color:var(--muted);position:relative}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg button .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-weight:600}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.info{padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 22px;align-items:flex-start}
.info h1{font-size:18px;margin:0 0 2px;text-wrap:balance}
.info p{margin:0;color:var(--muted);max-width:64ch}
.info .meta{color:var(--muted);font-size:13px;margin-top:3px}
.rate{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rate span{color:var(--muted);font-size:13px}
.stagewrap{padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.frame{position:relative;overflow:hidden;background:var(--panel);box-shadow:0 0 0 1px var(--line);border-radius:6px;margin-inline:auto}
.frame>.host{position:absolute;top:0;left:0;width:1440px;height:900px;transform-origin:0 0}
.tagging .frame{box-shadow:0 0 0 2px var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.card{background:transparent;border:0;padding:0;text-align:left;min-width:0}
.card .frame{pointer-events:none}
.card h2{font-size:15px;margin:8px 0 0}
.card p{margin:1px 0 0;color:var(--muted);font-size:13px}
.card:hover h2{text-decoration:underline}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;display:flex;flex-direction:column;gap:14px}
.drawer h2{font-size:16px;margin:0}
.drawer h3{font-size:13px;margin:0 0 4px;color:var(--muted);font-weight:600}
.drawer textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tagrow{border-top:1px solid var(--line);padding-block:7px;font-size:13px;display:flex;gap:8px;justify-content:space-between}
.tagrow b{font-weight:600}
.keep{color:var(--accent);font-weight:700}.drop{color:var(--bad);font-weight:700}
.x{border:0;background:transparent;color:var(--muted);padding:0 4px}
.status{font-size:12.5px;color:var(--muted)}
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;width:min(290px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px}
.pop b{font-size:13px}
.pop input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--bg)}
.hint{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 8px;color:var(--muted);font-size:13px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<div id="app"></div>
