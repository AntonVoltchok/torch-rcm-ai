# Deploy-ready, not deployed. `fly launch --copy-config` from apps/api with this file.
app = "torch-rcm-api"
primary_region = "ewr"
[build]
  dockerfile = "../../infra/api.Dockerfile"
[env]
  TORCH_AGENT_MODE = "deterministic"
  TORCH_DB_URL = "sqlite:////data/torch.db"
[mounts]
  source = "torch_data"
  destination = "/data"
[http_service]
  internal_port = 8000
  force_https = true
