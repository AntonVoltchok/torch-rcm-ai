# Render Blueprint for the API (ADR-0011). The web app is on Vercel: apps/web/vercel.json.
# One always-on instance with a disk: the scheduler worker runs in the API process and SQLite lives on /data.
services:
  - type: web
    name: torch-rcm-api
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    dockerContext: ./apps/api
    dockerfilePath: ./infra/api.Dockerfile
    healthCheckPath: /api/v1/clock
    domains:
      - rcm-ai-api.antonvolt.com
    disk:
      name: torch-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      # Live planner answering from the recorded canonical cassettes: real Claude output, no key, no network (ADR-0013).
      - key: TORCH_AGENT_MODE
        value: live
      - key: TORCH_CASSETTE_MODE
        value: replay
      - key: TORCH_DB_URL
        value: sqlite:////data/torch.db
      - key: TORCH_CORS_ORIGINS
        value: '["https://rcm-ai.antonvolt.com"]'
