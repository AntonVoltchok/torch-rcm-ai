[project]
name = "torch-api"
version = "0.1.0"
description = "Torch — agentic dental RCM demo: API, simulated world, scheduler and seed"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "typer>=0.13",
    "python-dateutil>=2.9",
    "anthropic>=0.40",
    "orjson>=3.10",
]

[project.scripts]
torch = "torch_rcm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.118",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["torch_rcm"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["openapi.snapshot.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PL", "N", "C4", "PIE", "RET"]
ignore = [
    "PLR0913",  # FastAPI handlers and dataclass-like builders take many keyword args
    "PLR0917",  # same, positional (seed builders mirror entity fields)
    "PLR0911",  # small routing tables read best as early returns
    "PLR2004",  # domain constants (30-day cadence, $1,000 cap) read better inline
    "B008",     # FastAPI Depends() in defaults is the framework idiom
    "RUF001",   # ×, →, ·, — are deliberate in user-facing text (the mocks' typography)
    "RUF002",
    "RUF003",
    "N812",     # `import schemas as S` / `targets as T` in read models and tests
    "PLC0415",  # local imports used deliberately to break import cycles (agents hook, optional deps)
]

[tool.ruff.lint.isort]
known-first-party = ["torch_rcm", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLR0912", "S101", "N802", "E501"]
# Seed data tables and the route table: one record per line is the readable form.
"torch_rcm/seed/canonical/*.py" = ["E501"]
"torch_rcm/api/contract.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
# CLAUDE.md promises `mypy --strict` on the domain and the agent runtime
module = ["torch_rcm.domain.*", "torch_rcm.agents.*"]
strict = true

[[tool.mypy.overrides]]
# optional-dependency shims: their ignores are used in one environment and unused in the other
module = ["torch_rcm.config", "torch_rcm.log", "torch_rcm.cli"]
warn_unused_ignores = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
