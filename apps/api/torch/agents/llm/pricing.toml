# Per-model list prices in USD per million tokens (07 §3.2). Used only for llm_calls accounting and the
# per-run cost cap (TORCH_RUN_COST_CAP_USD). USD per MTok == micro-USD per token, which is what we store.
#
# Multipliers apply to the input price:
#   cache write 1.25x (5-minute ephemeral), cache read 0.05x on Sonnet/Opus 5.5 and 0.1x on Haiku 5.5.
# Thinking tokens are billed as output. Re-check list prices before a cost claim in a demo.

[models."claude-sonnet-5-5"]
input_per_mtok = 3.00
output_per_mtok = 15.00
cache_write_multiplier = 1.25
cache_read_multiplier = 0.05

[models."claude-opus-5-5"]
input_per_mtok = 5.00
output_per_mtok = 25.00
cache_write_multiplier = 1.25
cache_read_multiplier = 0.05

[models."claude-haiku-5-5"]
input_per_mtok = 1.00
output_per_mtok = 5.00
cache_write_multiplier = 1.25
cache_read_multiplier = 0.1
